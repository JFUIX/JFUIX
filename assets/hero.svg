<svg width="900" height="240" viewBox="0 0 900 240" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#171c24"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <clipPath id="clip"><rect width="900" height="240" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="900" height="240" fill="url(#bg)"/>
    <circle cx="150" cy="240" r="95" fill="#7ee787" opacity="0.35" filter="url(#blur)"/>
    <circle cx="470" cy="10" r="85" fill="#58a6ff" opacity="0.28" filter="url(#blur)"/>
    <circle cx="790" cy="230" r="95" fill="#bc8cff" opacity="0.32" filter="url(#blur)"/>
    <rect width="900" height="240" fill="url(#grid)"/>
  </g>
  <rect x="0.5" y="0.5" width="899" height="239" rx="16" fill="none" stroke="#2a2f3a"/>
  <text x="450" y="132" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="56" font-weight="700" letter-spacing="14" fill="#ffffff">JAFFERY<tspan fill="#7ee787">_<animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/></tspan></text>
</svg>
